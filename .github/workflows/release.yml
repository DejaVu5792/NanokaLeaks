name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: NanokaLeaks
            setup_command: sudo apt-get update && sudo apt-get install -y gcc patchelf
            extra_flags: ""
          - os: windows-latest
            binary_name: NanokaLeaks.exe
            setup_command: echo "Windows runners already have MSVC compilers installed."
            extra_flags: "--windows-disable-console"

    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OS Dependencies
        run: ${{ matrix.setup_command }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Project Dependencies
        run: uv sync

      - name: Compile with Nuitka
        run: >
          uv run nuitka
          --standalone
          --onefile
          --enable-plugin=pyside6
          --assume-yes-for-downloads
          ${{ matrix.extra_flags }}
          -o ${{ matrix.binary_name }}
          main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binary
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
