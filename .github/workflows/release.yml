name: Build and Release Binaries

on:
  push:
    # Tag pushes always run (path filters do not apply to tags).
    tags:
      - 'v*'
    # Dependency/toolchain changes on main warm the build cache used by tag
    # builds. GitHub cache entries are ref-scoped, so a tag cannot restore a
    # cache saved by an older tag, only one from the default branch.
    branches:
      - main
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - '.python-version'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Keep Nuitka's C/onefile caches inside the workspace so they can be restored
# between runs. Nuitka also stores ccache/clcache output here.
env:
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: NanokaLeaks
            setup_command: sudo apt-get update && sudo apt-get install -y gcc patchelf ccache
            extra_flags: ""
          - os: windows-latest
            binary_name: NanokaLeaks.exe
            setup_command: echo "Windows runners already have MSVC compilers installed."
            extra_flags: "--windows-disable-console"

    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OS Dependencies
        run: ${{ matrix.setup_command }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Restore Nuitka build cache
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Compile with Nuitka
        run: >
          uv run nuitka
          --standalone
          --onefile
          --onefile-as-archive
          --enable-plugin=pyside6
          --assume-yes-for-downloads
          --include-data-files=nanoka_viewer/assets/nanokaleaks.png=nanokaleaks.png
          ${{ matrix.extra_flags }}
          -o ${{ matrix.binary_name }}
          main.py

      - name: Upload Build Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binary
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  appimage:
    name: Build AppImage
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OS Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc patchelf ccache

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Restore Nuitka build cache
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Verify AppImage update metadata
        run: |
          ./dist/*.AppImage --appimage-updateinformation
          test -s dist/*.AppImage.zsync

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
