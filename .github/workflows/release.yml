name: Build and Release Binaries

on:
  push:
    # Tag pushes always run (path filters do not apply to tags).
    tags:
      - 'v*'
    # Dependency/toolchain changes on main warm the build cache used by tag
    # builds. GitHub cache entries are ref-scoped, so a tag cannot restore a
    # cache saved by an older tag, only one from the default branch.
    branches:
      - main
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - '.python-version'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Keep Nuitka's C/onefile caches inside the workspace so they can be restored
# between runs. Nuitka also stores ccache/clcache output here.
env:
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary_name: NanokaLeaks
            # A Linux onefile bundles Qt but links against the distribution's
            # platform libraries. The runner image ships neither libEGL nor the
            # X11/xcb set, so the smoke test could not even import Qt; install
            # the runtime closure before building.
            setup_command: >
              sudo apt-get update && sudo apt-get install -y
              gcc patchelf ccache
              libegl1 libgl1 libglvnd0 libgbm1 libdrm2
              libxkbcommon0 libxkbcommon-x11-0 libxkbfile1
              libx11-xcb1 libxext6 libxfixes3 libxrandr2 libxtst6
              libxcomposite1 libxdamage1
              libxcb1 libxcb-render0 libxcb-shm0 libxcb-util1 libxcb-cursor0
              libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
              libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0
              libxcb-xkb1
              libwayland-client0 libwayland-cursor0 libwayland-server0
              libpulse0 libasound2t64
              libfontconfig1 libfreetype6 libharfbuzz0b libpng16-16
              libdbus-1-3 libglib2.0-0t64 libbrotli1 libkrb5-3 libexpat1
              libnss3 libnspr4 libudev1 zlib1g
            extra_flags: ""
          - os: windows-latest
            binary_name: NanokaLeaks.exe
            setup_command: echo "Windows runners already have MSVC compilers installed."
            extra_flags: "--windows-disable-console"

    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags, so tags must be present.
          fetch-depth: 0

      - name: Install OS Dependencies
        run: ${{ matrix.setup_command }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          python-version: "3.13"

      - name: Restore Nuitka build cache
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Compile with Nuitka
        shell: bash
        run: |
          source packaging/nuitka_flags.sh
          uv run nuitka \
            --standalone \
            --onefile \
            --onefile-as-archive \
            "${nuitka_flags[@]}" \
            ${{ matrix.extra_flags }} \
            -o ${{ matrix.binary_name }} \
            main.py

      # Compiling successfully says nothing about whether the bundle can start.
      # This builds the window from the packaged QML and fails the run if the
      # QML sources or an imported Qt module are missing.
      - name: Smoke test the compiled binary
        timeout-minutes: 5
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./${{ matrix.binary_name }} --version
          ./${{ matrix.binary_name }} --smoke-test

      - name: Upload Build Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-binary
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  appimage:
    name: Build AppImage
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags, so tags must be present.
          fetch-depth: 0

      - name: Install OS Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc patchelf ccache

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          python-version: "3.13"

      - name: Restore Nuitka build cache
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Verify AppImage update metadata
        run: |
          ./dist/*.AppImage --appimage-updateinformation
          test -s dist/*.AppImage.zsync

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
